name: Release

# Keeps ONE GitHub Release per version ("v<versionName>" from version.properties, e.g. v1.new)
# and refreshes it with every update:
#
#  - push to main/master  -> rebuilds the APK and replaces the files on the existing release
#                            (creates the release first if it does not exist yet)
#  - push of a tag v*     -> same, the tag must match version.properties
#  - manual "Run workflow"
#
# The visible version stays the same (e.g. "1.new"), but every build gets a higher
# versionCode (base versionCode + workflow run number), so Android installs each new
# APK as an update over the previous one without uninstalling.
#
# To publish a NEW version instead, change versionName in version.properties.
on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          base=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v${name}"
          code=$(( base * 10000 + GITHUB_RUN_NUMBER ))
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "CLEARIT_VERSION_CODE=${code}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${name} in version.properties (expected ${tag})"
            exit 1
          fi
          echo "Building ${tag} with versionCode ${code}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEARIT_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "CLEARIT_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from repository secrets."
          else
            echo "::warning::CLEARIT_KEYSTORE_BASE64 secret not set - the APK will be signed with a temporary debug key. See docs/BUILDING.md."
          fi

      - name: Test and build release APK
        env:
          CLEARIT_KEYSTORE_PASSWORD: ${{ secrets.CLEARIT_KEYSTORE_PASSWORD }}
          CLEARIT_KEY_ALIAS: ${{ secrets.CLEARIT_KEY_ALIAS }}
          CLEARIT_KEY_PASSWORD: ${{ secrets.CLEARIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare assets
        id: assets
        run: |
          apk="clearit-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          sha256sum "${apk}" > "${apk}.sha256"
          notes="docs/releases/${{ steps.version.outputs.tag }}.md"
          [[ -f "${notes}" ]] || notes="CHANGELOG.md"
          {
            cat "${notes}"
            echo
            echo "---"
            echo "Build ${{ steps.version.outputs.code }} · commit ${GITHUB_SHA::7} · $(date -u '+%Y-%m-%d %H:%M UTC')"
          } > release-notes.md
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"

      - name: Publish or update GitHub Release
        run: |
          tag="${{ steps.version.outputs.tag }}"
          apk="${{ steps.assets.outputs.apk }}"
          if gh release view "${tag}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Updating existing release ${tag}"
            gh release upload "${tag}" "${apk}" "${apk}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "${tag}" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            echo "Creating release ${tag}"
            gh release create "${tag}" "${apk}" "${apk}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "Clearit ${tag}" \
              --notes-file release-notes.md
          fi
