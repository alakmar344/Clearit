name: Release

# Publishes a GitHub Release named "v<versionName>" (from version.properties) with a
# signed release APK attached.
#
# Triggers:
#  - pushing a tag such as v1.new
#  - pushing to main/master when no release exists yet for the current version
#    (so merging a version bump publishes it automatically)
#  - manual "Run workflow"
on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          name=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match versionName ${name} in version.properties (expected ${tag})"
            exit 1
          fi

      - name: Check for existing release
        id: existing
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to publish
        id: decide
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "branch" && "${GITHUB_EVENT_NAME}" == "push" && "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            echo "Release ${{ steps.version.outputs.tag }} already exists; bump versionName to publish a new one."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.decide.outputs.publish == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.decide.outputs.publish == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        if: steps.decide.outputs.publish == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.CLEARIT_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            echo "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/release.jks"
            echo "CLEARIT_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from repository secrets."
          else
            echo "::warning::CLEARIT_KEYSTORE_BASE64 secret not set - the APK will be signed with a temporary debug key. See docs/BUILDING.md."
          fi

      - name: Test and build release APK
        if: steps.decide.outputs.publish == 'true'
        env:
          CLEARIT_KEYSTORE_PASSWORD: ${{ secrets.CLEARIT_KEYSTORE_PASSWORD }}
          CLEARIT_KEY_ALIAS: ${{ secrets.CLEARIT_KEY_ALIAS }}
          CLEARIT_KEY_PASSWORD: ${{ secrets.CLEARIT_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Prepare assets
        if: steps.decide.outputs.publish == 'true'
        id: assets
        run: |
          apk="clearit-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "${apk}"
          sha256sum "${apk}" > "${apk}.sha256"
          notes="docs/releases/${{ steps.version.outputs.tag }}.md"
          [[ -f "${notes}" ]] || notes="CHANGELOG.md"
          echo "apk=${apk}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: steps.decide.outputs.publish == 'true'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if [[ "${{ steps.existing.outputs.exists }}" == "true" ]]; then
            gh release upload "${tag}" "${{ steps.assets.outputs.apk }}" "${{ steps.assets.outputs.apk }}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "${tag}" \
              "${{ steps.assets.outputs.apk }}" "${{ steps.assets.outputs.apk }}.sha256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "${GITHUB_SHA}" \
              --title "Clearit ${tag}" \
              --notes-file "${{ steps.assets.outputs.notes }}"
          fi
